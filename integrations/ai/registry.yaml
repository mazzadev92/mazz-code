# MAZZ Control - registre des fournisseurs IA (source de verite unique).
#
# Lecture : integrations/ai/loader.py. Aucun plafond ni URL n'existe ailleurs dans le code.
# Verification des URLs : docs officielles lues le 2026-11-03. Une URL non confirmee est laissee
# vide (base_url: null) avec "# TODO: verifier" : le fournisseur reste en statut missing_url.
#
# Semantique de `enabled` : valeur de livraison (false partout). L'activation reelle vient de la cle :
# cle presente dans .env => eligible au routage ("untested" puis "active" au premier succes).
# AI_<ID>_DISABLED=1 dans .env coupe un fournisseur sans toucher a ce fichier.
#
# Champs de `limits` (tous optionnels sauf reset) :
#   rpm / tpm            fenetre glissante de 60 s (requetes, tokens)
#   rpd, tpd             par fenetre `reset` (requetes, tokens)
#   rpmonth, tpmonth     idem, pour un reset mensuel ; `units` + `unit_cap` = unite mesurable propre au fournisseur
#                        (caracteres, credits...) et son plafond par fenetre ; rpd/rpmonth/tpd/tpmonth s'appliquent
#                        tous a la fenetre definie par `reset`
#   reset                continuous | daily | weekly | monthly | never
#   reset_tz, reset_hour fuseau IANA et heure locale du reset (weekly : dimanche 00:00 UTC, monthly : le 1er)
#   budget_note          quota documente mais non mesurable cote client (compteur non expose par l'API) : informatif
#
# Ids de modeles : valeurs de depart. Le bouton "Tester" affiche les ids reels du fournisseur ;
# `model_pattern` choisit, par decouverte, le premier id correspondant quand aucun id n'est fige.
# Alias utilises par le routeur : frontier (meilleur modele), fast (rapide), code, embed, vision.

# Reglages du routeur : aucune valeur n'est codee en dur ailleurs.
router:
  timeout_s: 30            # delai maximal d'un appel fournisseur
  max_retries: 2           # essais supplementaires sur un AUTRE fournisseur
  retry_after_cap_s: 900   # plafond du Retry-After d'un fournisseur qui repond 429
  breaker: { failures: 3, cooldown_s: 60, max_backoff_s: 900 }
  # Ordre de selection : selfhost -> free -> credit -> paid, puis priority croissante.
  cost_order: [selfhost, free, credit, paid]

