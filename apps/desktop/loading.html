<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mazz Code</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f4ee; --ink: #2b2723; --muted: #6f675d; --line: #d9d2c6; --accent: #8a6a3f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1a17; --ink: #efe9df; --muted: #a89f92; --line: #3a352e; --accent: #c9a57a; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Iowan Old Style", Palatino, Georgia, serif; }
    main { width: min(520px, 86vw); text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
    .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: .01em; }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .bar { position: relative; height: 2px; margin: 30px auto 18px; width: 100%; background: var(--line); overflow: hidden; }
    .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 34%; background: var(--accent); animation: slide 1.35s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
    #status { min-height: 22px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="assets/logo.png" alt="Mazz Code Logo"></div>
    <h1>Mazz Code</h1>
    <p>Studio d'agents local. Rien ne quitte cette machine sans votre accord.</p>
    <div class="bar" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite">Préparation du démarrage…</p>
  </main>
  <script>
    const status = document.getElementById('status');
    if (window.mazzDesktop) window.mazzDesktop.onStatus((text) => { status.textContent = text; });
  </script>
</body>
</html>
