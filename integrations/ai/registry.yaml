    adapter: openai_compat
    capabilities: [chat, vision, embedding]
    models: []
    model_pattern: ".*"
    limits: { reset: never }
    priority: 1
    cost_class: selfhost
    requires_card: false
    requires_phone: false
    signup_url: "https://www.oracle.com/cloud/free/"
    enabled: false
    notes: "VM Always Free (ARM). Voir selfhost/oracle. Cle optionnelle (vLLM --api-key)."
    key_path: "Pas de console : la cle est celle que vous passez a vllm --api-key (LOCAL_ORACLE_KEY), ou vide."
    practical: "Inference illimitee sur votre propre VM, 24/7."

