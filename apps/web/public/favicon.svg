  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F674A" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#123C2C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="seed-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#F5E1C4" stop-opacity="0.95" />
